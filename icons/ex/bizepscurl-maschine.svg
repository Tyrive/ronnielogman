    <path d="M346 292 L320 212 L332 208 L358 290 Z" fill="url(#metal)" stroke="#7d8287" stroke-width="2" opacity="0.95"/>
    <rect x="300" y="196" width="40" height="11" rx="5" fill="#3a3c3f" transform="rotate(-18 320 201)"/>
    <circle cx="314" cy="206" r="9" fill="#c4c4c4" stroke="#6f6f6f" stroke-width="1.5"/>
